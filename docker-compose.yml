services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ws-notifier-1
      - ws-notifier-2
      - ws-notifier-3
      - notification-service-1
    restart: unless-stopped

  ws-notifier-1:
    build:
      context: .
      dockerfile: ./ws-notifier/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      notification-service-1:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
    restart: unless-stopped

  ws-notifier-2:
    build:
      context: .
      dockerfile: ./ws-notifier/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      notification-service-1:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
    restart: unless-stopped

  ws-notifier-3:
    build:
      context: .
      dockerfile: ./ws-notifier/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      notification-service-1:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
    restart: unless-stopped

  notification-service-1:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    env_file:
      - .env
    environment:
      - NS_OUTBOX_DISPATCHER_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 60s
      timeout: 3s
      retries: 10
      start_period: 5s

  notification-service-2:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    env_file:
      - .env
    environment:
      - NS_OUTBOX_DISPATCHER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${NS_REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${NS_REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: [ "CMD", "redis-cli", "--pass", "${NS_REDIS_PASSWORD:-redis_password}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10
    command: ["-js", "-DV", "--logtime"]
    ports:
      - "4222:4222"

volumes:
  postgres_data:
  redis_data: