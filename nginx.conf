events {
    worker_connections 1024;
}

http {
    upstream ws_backend {
        least_conn;     # для прода лучше ip_hash
        server ws-notifier-1:8081;
        server ws-notifier-2:8081;
        server ws-notifier-3:8081;
    }

    upstream api_backend {
        least_conn;
        server notification-service-1:8080;
        server notification-service-2:8080;
    }

    server {
        listen 8080;

        # WebSocket
        location /ws {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Метрики notification-service
        location /metrics/ns {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # Метрики ws-notifier
        location /metrics/ws{
            proxy_pass http://ws_backend;
            proxy_set_header Host $host;
        }

        # REST API
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck
        location /health {
            return 200 "OK\n";
        }
    }
}